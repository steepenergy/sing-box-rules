
name: Update v2fly GeoIP RU

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate JSON from v2fly
        run: python scripts/build-v2fly-geoip-ru.py

      - name: Install sing-box
        run: |
          go install github.com/sagernet/sing-box/cmd/sing-box@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Compile SRS
        run: |
          sing-box rule-set compile \
            --output v2fly-geoip-ru.srs \
            v2fly-geoip-ru.json

      - name: Validate output
        run: test -s v2fly-geoip-ru.srs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v2fly-geoip-ru.json v2fly-geoip-ru.srs

          if ! git diff --cached --quiet; then
            git commit -m "Update v2fly GeoIP RU"
            git push
          fi
