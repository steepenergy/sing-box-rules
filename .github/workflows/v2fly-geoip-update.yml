# v2fly-geoip-ru.srs <- v2fly/geoip (ветка release, text/ru.txt)
#
#   База: DB-IP Lite Country (db-ip.com), независима от MaxMind.
#   v2fly выбирает страну по расположению: country, затем registered_country,
#   затем represented_country. Релиз собирается раз в месяц, 5-го в 00:00 UTC.
#   scripts/build-v2fly-geoip-ru.py превращает ru.txt в v2fly-geoip-ru.json,
#   sing-box компилирует его в .srs.
name: Update v2fly GeoIP RU

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 6 * *"  # v2fly публикует релиз 5-го числа в 00:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate JSON from v2fly
        run: python scripts/build-v2fly-geoip-ru.py

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Готовый бинарник последнего стабильного релиза вместо сборки из исходников
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[].browser_download_url | select(test("-linux-amd64\\.tar\\.gz$"))' \
            | head -n 1)
          test -n "$URL"

          curl -fsSL --retry 3 --retry-delay 5 -o sing-box.tar.gz "$URL"
          tar -xzf sing-box.tar.gz
          sudo install sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Compile SRS
        run: |
          sing-box rule-set compile \
            --output v2fly-geoip-ru.srs \
            v2fly-geoip-ru.json

      - name: Validate output
        run: |
          test -s v2fly-geoip-ru.srs
          test "$(head -c 3 v2fly-geoip-ru.srs)" = "SRS"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v2fly-geoip-ru.json v2fly-geoip-ru.srs

          if ! git diff --cached --quiet; then
            git commit -m "Update v2fly GeoIP RU"
            git push
          fi
