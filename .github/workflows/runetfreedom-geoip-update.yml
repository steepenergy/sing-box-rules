# runetfreedom-geoip-ru.srs <- runetfreedom/russia-v2ray-rules-dat
#                              (ветка release, sing-box/rule-set-geoip/geoip-ru.srs)
#
#   Цепочка сборки:
#   MaxMind GeoLite2-Country (CSV)
#     -> Loyalsoldier/geoip: geoip.dat, страна по расположению
#        (country, затем registered_country, затем represented_country)
#     -> runetfreedom/russia-blocked-geoip: берёт geoip.dat Loyalsoldier целиком,
#        категорию "ru" не меняет, добавляет свои (ru-blocked, re-filter и др.)
#     -> runetfreedom/russia-v2ray-rules-dat: geodat2srs конвертирует в .srs
#   runetfreedom пересобирает файлы каждые 6 часов; категория "ru" меняется
#   вместе с выпусками Loyalsoldier/GeoLite2.
name: Update runetfreedom GeoIP RU

on:
  schedule:
    - cron: '30 3 * * *'  # Каждый день в 03:30 (по UTC), после Sync External Rules
  workflow_dispatch:      # Кнопка для ручного запуска в интерфейсе Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download geoip-ru
        run: |
          # Любая ошибка останавливает шаг: старый файл остаётся, коммита не будет
          set -euo pipefail

          URL="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/sing-box/rule-set-geoip/geoip-ru.srs"
          FILE="runetfreedom-geoip-ru.srs"

          echo "Downloading $FILE from runetfreedom..."
          # -f: при HTTP-ошибке (404, 5xx) не сохранять страницу ошибки как файл
          curl -fsSL --retry 3 --retry-delay 5 -o "$FILE.tmp" "$URL"

          # Настоящий rule-set всегда начинается с сигнатуры "SRS"
          if [ "$(head -c 3 "$FILE.tmp")" != "SRS" ]; then
            echo "::error::$FILE: downloaded file is not a valid SRS rule-set"
            exit 1
          fi

          mv "$FILE.tmp" "$FILE"

      - name: Commit and Push binary
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update runetfreedom GeoIP RU"
          file_pattern: "runetfreedom-geoip-ru.srs"
