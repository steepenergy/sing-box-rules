# Зеркало готовых rule-set от SagerNet.
#
# geosite-*.srs <- SagerNet/sing-geosite (ветка rule-set)
#   База: v2fly/domain-list-community (dlc.dat) — списки доменов,
#   которые сообщество ведёт вручную через pull request.
#
# geoip-ru.srs  <- SagerNet/sing-geoip (ветка rule-set)
#   База: MaxMind GeoLite2-Country (Country.mmdb из Dreamacro/maxmind-geoip,
#   обновляется раз в месяц, 12-го).
#   Внимание: страна берётся только по registered_country (страна регистрации
#   блока адресов), поэтому сюда попадают зарубежные подсети с регистрацией в РФ,
#   например 80.77.164.0/24 (Meta CDN, Литва).
#   См. https://github.com/SagerNet/sing-geoip/pull/9
#   Наборы с выбором страны по расположению: runetfreedom-geoip-ru.srs (MaxMind)
#   и v2fly-geoip-ru.srs (DB-IP).
name: Sync External Rules

on:
  schedule:
    - cron: '0 3 * * *'  # Запускать каждый день в 03:00 (по UTC)
  workflow_dispatch:     # Кнопка для ручного запуска в интерфейсе Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download rule sets
        run: |
          # Любая ошибка останавливает шаг: старые файлы остаются, коммита не будет
          set -euo pipefail

          # Теперь здесь просто удобный список файлов
          FILES=(
            "geosite-category-ru.srs"
            "geosite-apple.srs"
            "geoip-ru.srs"
            "geosite-google.srs"
            "geosite-google-deepmind.srs"
            "geosite-youtube.srs"
            "geosite-category-ntp.srs"
            "geosite-vokino.srs"
          )

          for file in "${FILES[@]}"; do
            # Магия Bash: отрезаем от имени файла всё, начиная с первого дефиса.
            # Получаем либо "geosite", либо "geoip"
            TYPE="${file%%-*}"
            
            # Подставляем полученный тип в базовый URL
            URL="https://raw.githubusercontent.com/SagerNet/sing-${TYPE}/rule-set/${file}"
            
            echo "Downloading $file from sing-${TYPE}..."
            # -f: при HTTP-ошибке (404, 5xx) не сохранять страницу ошибки как файл
            curl -fsSL --retry 3 --retry-delay 5 -o "$file.tmp" "$URL"

            # Настоящий rule-set всегда начинается с сигнатуры "SRS"
            if [ "$(head -c 3 "$file.tmp")" != "SRS" ]; then
              echo "::error::$file: downloaded file is not a valid SRS rule-set"
              exit 1
            fi

            mv "$file.tmp" "$file"
          done

      - name: Commit and Push binaries
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-sync rule sets"
          file_pattern: "*.srs"
